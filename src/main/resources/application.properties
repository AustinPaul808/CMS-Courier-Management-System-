spring.application.name=courier-management

# Supabase PostgreSQL connection
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5

# Disable web server — this is a console application
spring.main.web-application-type=none

# Suppress Spring Boot banner for cleaner console output
spring.main.banner-mode=off

# Reduce startup log noise (keep WARN and above from Spring internals)
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN

